name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t veghe:ci .
      - name: Smoke test
        run: |
          TOKEN=ci-admin-token-not-a-secret
          # The app refuses to boot without ADMIN_TOKEN, by design.
          docker run -d --rm -p 8080:8080 -e ADMIN_TOKEN=$TOKEN -e ALLOW_PRIVATE_TARGETS=true --name veghe veghe:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 0.5
          done
          # Monitor the container's own health endpoint and wait for a real check.
          curl -fsS -X POST http://localhost:8080/api/monitors \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"name":"self","url":"http://127.0.0.1:8080/healthz","intervalSeconds":10,"timeoutMs":2000}' \
            | grep -q '"status":"pending"'
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/api/status | grep -q '"overall":"operational"' && OK=1 && break
            sleep 0.5
          done
          test "$OK" = 1
          curl -fsS http://localhost:8080/api/status | grep -q '"region":"local"'
          curl -fsS http://localhost:8080/ | grep -q veghe
          docker stop veghe
